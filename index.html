<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微云网络科技 - 微信解封进度查询</title>
    <style>
        :root {
            --primary: #4A6CF7;
            --primary-dark: #3651d5;
            --primary-light: #e8ecff;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-secondary: #5a6878;
            --text-light: #8896a6;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(160deg, #e8eef6 0%, #dce4f0 25%, #eef2f8 50%, #e3eaf4 75%, #f0f4f9 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            opacity: 0.35;
            filter: blur(80px);
        }
        .bg-decoration-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #c4d4f8 0%, transparent 70%);
            top: -100px;
            right: -80px;
            animation: float1 18s ease-in-out infinite;
        }
        .bg-decoration-2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #d0dff9 0%, transparent 70%);
            bottom: -90px;
            left: -60px;
            animation: float2 22s ease-in-out infinite;
        }
        .bg-decoration-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #bcccf4 0%, transparent 70%);
            top: 45%;
            left: 55%;
            animation: float3 15s ease-in-out infinite;
        }

        @keyframes float1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-40px, 30px) scale(1.08);
            }
            50% {
                transform: translate(-15px, -20px) scale(0.94);
            }
            75% {
                transform: translate(30px, -10px) scale(1.04);
            }
        }
        @keyframes float2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(35px, -25px) scale(1.06);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.95);
            }
        }
        @keyframes float3 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-25px, -30px) scale(1.1);
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        /* 品牌头部 */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeInDown 0.7s ease-out;
        }
        .brand-icon {
            display: inline-block;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #5b7cfd 0%, #4A6CF7 40%, #3651d5 100%);
            border-radius: 16px;
            margin-bottom: 12px;
            position: relative;
            box-shadow: 0 8px 24px rgba(74, 108, 247, 0.3);
            animation: iconPulse 3s ease-in-out infinite;
        }
        .brand-icon::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 12px;
            left: 19px;
            box-shadow:
                8px 6px 0 -4px white,
                2px 16px 0 -2px white,
                18px 14px 0 -6px white,
                -2px 10px 0 -5px white;
            opacity: 0.9;
        }
        @keyframes iconPulse {
            0%,
            100% {
                box-shadow: 0 8px 24px rgba(74, 108, 247, 0.3);
            }
            50% {
                box-shadow: 0 8px 32px rgba(74, 108, 247, 0.5);
            }
        }
        .brand-name {
            font-size: 26px;
            font-weight: 700;
            color: #1a2744;
            letter-spacing: 2px;
            margin: 0;
        }
        .brand-name .highlight {
            background: linear-gradient(135deg, #4A6CF7 0%, #5b8af7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-subtitle {
            font-size: 13px;
            color: #8896a6;
            letter-spacing: 1.5px;
            margin-top: 4px;
            font-weight: 400;
        }

        /* 查询卡片 */
        .query-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 26px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 20px;
            animation: fadeInUp 0.7s ease-out 0.15s both;
            border: 1px solid rgba(226, 232, 240, 0.7);
            transition: var(--transition);
        }
        .query-card:hover {
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.13), 0 4px 14px rgba(0, 0, 0, 0.07);
        }

        .query-card .card-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .dot {
            width: 8px;
            height: 8px;
            background: #4A6CF7;
            border-radius: 50%;
            display: inline-block;
            animation: dotBlink 2s ease-in-out infinite;
        }
        @keyframes dotBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .query-card .card-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 18px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .input-wrapper .prefix-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            pointer-events: none;
            z-index: 2;
        }
        .input-wrapper .prefix-icon svg {
            width: 100%;
            height: 100%;
            color: #b0bec5;
        }
        .wechat-input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: var(--transition);
            background: #fafbfc;
            color: var(--text);
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        .wechat-input:focus {
            border-color: #4A6CF7;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.08);
        }
        .wechat-input::placeholder {
            color: #c0c9d4;
            letter-spacing: 0;
        }
        .wechat-input.error {
            border-color: #f56565;
            background: #fffafa;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        .btn-query {
            padding: 13px 28px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #4A6CF7 0%, #3d5ce5 100%);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            letter-spacing: 1px;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(74, 108, 247, 0.35);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }
        .btn-query:hover {
            background: linear-gradient(135deg, #5b7cfd 0%, #4A6CF7 100%);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.45);
            transform: translateY(-1px);
        }
        .btn-query:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.3);
            transition: 0.1s;
        }
        .btn-query:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-query .btn-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .btn-reset {
            padding: 13px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #6b7d95;
            background: #f1f5f9;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            letter-spacing: 1px;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }
        .btn-reset:hover {
            background: #e8edf4;
            color: #4a5568;
            border-color: #cbd5e0;
        }
        .btn-reset:active {
            transform: scale(0.96);
        }

        /* 结果卡片 */
        .result-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
            border: 1px solid rgba(226, 232, 240, 0.7);
            display: none;
        }
        .result-card.show {
            display: block;
        }
        .result-header {
            background: linear-gradient(135deg, #f8faff 0%, #f0f4fd 100%);
            padding: 18px 24px;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-header .result-wechat {
            font-weight: 600;
            font-size: 15px;
            color: #1a2744;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-header .result-wechat .wx-icon {
            width: 22px;
            height: 22px;
            background: #07C160;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .wx-icon svg {
            width: 14px;
            height: 14px;
            fill: white;
        }
        .result-time {
            font-size: 12px;
            color: #8896a6;
            font-weight: 400;
        }
        .result-body {
            padding: 22px 24px 24px;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: #fff7ed;
            color: #e07b2c;
            border: 1px solid #fde8d5;
        }
        .status-badge.early {
            background: #fff5f5;
            color: #d94444;
            border-color: #fdd;
        }
        .status-badge.mid {
            background: #fffef5;
            color: #b8860b;
            border-color: #fef3c7;
        }
        .status-badge.late {
            background: #f5f9ff;
            color: #3651d5;
            border-color: #dce8fd;
        }
        .progress-section {
            margin-bottom: 16px;
        }
        .progress-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .progress-percent {
            font-weight: 700;
            font-size: 20px;
            color: #4A6CF7;
            transition: color 0.5s;
        }
        .progress-bar-outer {
            width: 100%;
            height: 14px;
            background: #eef2f8;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-inner {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #f0a050 0%, #f5c060 30%, #7daef8 60%, #4A6CF7 100%);
            background-size: 200% 100%;
            background-position: 0 0;
            transition: width 1.5s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
            width: 0%;
        }
        .progress-bar-inner.animate {
            /* width 由 JS 设置 */;
        }
        .progress-bar-inner::after {
            content: '';
            position: absolute;
            top: 0;
            left: -60px;
            width: 40px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shimmer 2s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer {
            0% {
                left: -60px;
            }
            100% {
                left: calc(100% + 60px);
            }
        }
        .progress-detail {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 6px;
        }
        .info-box {
            background: #f8fafd;
            border-radius: var(--radius-xs);
            padding: 14px 16px;
            margin-top: 14px;
            border-left: 3px solid #4A6CF7;
            font-size: 13px;
            color: #4a5568;
            line-height: 1.7;
        }
        .info-box strong {
            color: #2d3748;
        }
        .info-box .icon-tip {
            display: inline-block;
            margin-right: 4px;
        }

        /* 加载动画 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: all;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-spinner-wrap {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 32px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e8eef6;
            border-top-color: #4A6CF7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            font-size: 14px;
            color: #5a6878;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% {
                content: '';
            }
            25% {
                content: '.';
            }
            50% {
                content: '..';
            }
            75% {
                content: '...';
            }
            100% {
                content: '';
            }
        }

        /* 底部 */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #b0bec5;
            margin-top: 16px;
            letter-spacing: 0.5px;
            animation: fadeInUp 0.7s ease-out 0.3s both;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .query-card {
                padding: 20px 16px;
                border-radius: 14px;
            }
            .result-card {
                border-radius: 14px;
            }
            .result-body {
                padding: 16px 14px 18px;
            }
            .result-header {
                padding: 14px 16px;
            }
            .brand-name {
                font-size: 22px;
            }
            .brand-icon {
                width: 46px;
                height: 46px;
                border-radius: 13px;
            }
            .brand-icon::after {
                width: 14px;
                height: 14px;
                top: 10px;
                left: 16px;
                box-shadow: 6px 5px 0 -3px white, 2px 13px 0 -2px white, 14px 11px 0 -5px white, -1px 8px 0 -4px white;
            }
            .btn-query {
                width: 100%;
                padding: 14px;
                font-size: 15px;
            }
            .btn-reset {
                width: 100%;
                text-align: center;
            }
            .input-group {
                flex-direction: column;
            }
            .wechat-input {
                font-size: 14px;
                padding: 12px 12px 12px 38px;
            }
            .progress-percent {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="bg-decoration bg-decoration-1"></div>
    <div class="bg-decoration bg-decoration-2"></div>
    <div class="bg-decoration bg-decoration-3"></div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner-wrap">
            <div class="spinner"></div>
            <div class="loading-text">正在查询<span class="loading-dots"></span></div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 品牌头部 -->
        <div class="brand-header">
            <div class="brand-icon"></div>
            <h1 class="brand-name"><span class="highlight">微云</span>网络科技</h1>
            <p class="brand-subtitle">WEIYUN NETWORK TECHNOLOGY</p>
        </div>

        <!-- 查询卡片 -->
        <div class="query-card" id="queryCard">
            <div class="card-title">
                <span class="dot"></span>微信解封进度查询
            </div>
            <p class="card-desc">请输入需要查询的微信号，获取最新解封审核进度。</p>
            <div class="input-group">
                <div class="input-wrapper">
                    <span class="prefix-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                        </svg>
                    </span>
                    <input
                    type="text"
                    class="wechat-input"
                    id="wechatInput"
                    placeholder="请输入微信号 / 手机号"
                    autocomplete="off"
                    maxlength="40"
                    >
                </div>
                <button class="btn-query" id="btnQuery" onclick="handleQuery()">
                    查询进度
                </button>
                <button class="btn-reset" id="btnReset" onclick="handleReset()" style="display:none;">
                    重新查询
                </button>
            </div>
        </div>

        <!-- 结果卡片 -->
        <div class="result-card" id="resultCard">
            <div class="result-header">
                <span class="result-wechat">
                    <span class="wx-icon">
                        <svg viewBox="0 0 24 24"><path d="M8.69 3.46C5.36 3.46 2.5 5.85 2.5 9c0 1.7.9 3.2 2.3 4.2l-.6 1.8c-.1.4.3.8.7.6l2.1-1.1c.6.2 1.3.3 2 .3.4 0 .7 0 1-.1C9.5 16.5 11 18.5 13 20c3.3 0 6.2-2.4 6.2-5.5S16.3 9 13 9c-.3 0-.7 0-1 .1 0-.4-.1-.7-.1-1.1 0-2.5-1.8-4.5-4.2-4.5z"/></svg>
                    </span>
                    <span id="resultWechat">—</span>
                </span>
                <span class="result-time" id="resultTime">—</span>
            </div>
            <div class="result-body">
                <div class="status-row">
                    <span>当前状态：</span>
                    <span class="status-badge" id="statusBadge">—</span>
                </div>
                <div class="progress-section">
                    <div class="progress-label-row">
                        <span>解封进度</span>
                        <span class="progress-percent" id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar-outer">
                        <div class="progress-bar-inner" id="progressBar" style="width: 0%;"></div>
                    </div>
                    <p class="progress-detail" id="progressDetail">—</p>
                </div>
                <div class="info-box" id="infoBox">
                    <span class="icon-tip">💡</span> <strong>温馨提示：</strong><span id="infoText">—</span>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <p class="footer">© 2024 微云网络科技 · 提供专业账号服务</p>
    </div>

    <script>
        // ==================== 10个预设情况（进度均在80%以下） ====================
        const queryCases = [{
            id: 1,
            status: '账号初步审核中',
            statusClass: 'early',
            progress: 13,
            detail: '预计还需 5~7 个工作日',
            info: '您的账号已进入初步审核队列，系统正在核对基本信息。请确保绑定的手机号畅通，以便接收验证通知。此阶段为自动审核，无需人工干预。',
            waitDays: '5~7',
        }, {
            id: 2,
            status: '资料提交核验阶段',
            statusClass: 'early',
            progress: 22,

        }, {

            statusClass: 'late',
            progress: 68,
            detail: '预计还需 1~2 个工作日',
            info: '系统正在进行多维度综合判定，整合各环节审核结果。此阶段为自动化流程的最终环节，即将出具审核结论。',
            waitDays: '1~2',
        }, {
            id: 9,
            status: '高级复核审查阶段',
            statusClass: 'late',
            progress: 74,
            detail: '预计还需 1~2 个工作日',
            info: '已进入高级复核阶段，由资深审核团队进行最终把关。此阶段审核较为严格，请理解并耐心等待最终结果通知。',
            waitDays: '1~2',
        }, {
            id: 10,
            status: '最终审核待确认',
            statusClass: 'late',
            progress: 78,
            detail: '预计还需 1 个工作日',
            info: '您的账号已进入最终审核确认环节，结果即将出炉。请留意微信服务通知，审核结果将通过官方渠道第一时间告知。',
            waitDays: '1',
        }];

        // ==================== DOM 元素 ====================
        const wechatInput = document.getElementById('wechatInput');
        const btnQuery = document.getElementById('btnQuery');
        const btnReset = document.getElementById('btnReset');
        const resultCard = document.getElementById('resultCard');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultWechat = document.getElementById('resultWechat');
        const resultTime = document.getElementById('resultTime');
        const statusBadge = document.getElementById('statusBadge');
        const progressPercent = document.getElementById('progressPercent');
        const progressBar = document.getElementById('progressBar');
        const progressDetail = document.getElementById('progressDetail');
        const infoText = document.getElementById('infoText');

        let currentProgressValue = 0;
        let isQuerying = false;

        // ==================== 工具函数 ====================
        function getRandomCase() {
            const index = Math.floor(Math.random() * queryCases.length);
            // 在预设进度基础上微调 ±3%，但不超过79%
            const caseData = { ...queryCases[index] };
            const variation = Math.floor(Math.random() * 7) - 3; // -3 ~ +3
            let adjustedProgress = caseData.progress + variation;
            if (adjustedProgress < 5) adjustedProgress = 5;
            if (adjustedProgress > 79) adjustedProgress = 79;
            caseData.progress = adjustedProgress;
            caseData.detail = `预计还需 ${caseData.waitDays} 个工作日`;
            return caseData;
        }

        function getNowString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}:${s}`;
        }

        function validateWechatId(input) {
            const trimmed = input.trim();
            if (!trimmed) return false;
            // 微信号：字母开头，可含字母数字下划线减号，6-20位
            // 手机号：11位数字
            // 宽松验证：至少3个字符
            if (trimmed.length < 3) return false;
            if (trimmed.length > 40) return false;
            // 允许中文、字母、数字、下划线、减号
            const validPattern = /^[a-zA-Z0-9_\-\u4e00-\u9fa5]+$/;
            return validPattern.test(trimmed);
        }

        // ==================== 查询处理 ====================
        function handleQuery() {
            if (isQuerying) return;

            const inputValue = wechatInput.value.trim();

            // 输入验证
            if (!inputValue) {
                wechatInput.classList.add('error');
                wechatInput.placeholder = '请输入微信号';
                wechatInput.focus();
                setTimeout(() => {
                    wechatInput.classList.remove('error');
                    wechatInput.placeholder = '请输入微信号 / 手机号';
                }, 1500);
                return;
            }

            if (!validateWechatId(inputValue)) {
                wechatInput.classList.add('error');
                wechatInput.placeholder = '请输入有效的微信号';
                wechatInput.focus();
                setTimeout(() => {
                    wechatInput.classList.remove('error');
                    wechatInput.placeholder = '请输入微信号 / 手机号';
                }, 1500);
                return;
            }

            // 开始查询
            isQuerying = true;
            btnQuery.disabled = true;
            btnQuery.textContent = '查询中...';
            resultCard.classList.remove('show');
            loadingOverlay.classList.add('show');

            // 模拟查询延迟（0.8~1.6秒随机）
            const queryDelay = 800 + Math.floor(Math.random() * 800);

            setTimeout(() => {
                // 随机选取一个情况
                const caseData = getRandomCase();

                // 隐藏加载动画
                loadingOverlay.classList.remove('show');

                // 填充结果
                resultWechat.textContent = inputValue;
                resultTime.textContent = '查询时间：' + getNowString();
                statusBadge.textContent = caseData.status;
                statusBadge.className = 'status-badge ' + caseData.statusClass;
                progressPercent.textContent = '0%';
                progressBar.style.width = '0%';
                progressDetail.textContent = caseData.detail;
                infoText.textContent = caseData.info;
                currentProgressValue = caseData.progress;

                // 显示结果卡片
                resultCard.classList.add('show');

                // 滚动到结果区域
                setTimeout(() => {
                    resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);

                // 进度条动画
                setTimeout(() => {
                    animateProgress(caseData.progress);
                }, 300);

                // 更新按钮状态
                btnQuery.style.display = 'none';
                btnReset.style.display = 'inline-block';
                btnQuery.disabled = false;
                btnQuery.textContent = '查询进度';
                isQuerying = false;

                // 禁用输入框
                wechatInput.disabled = true;
                wechatInput.style.opacity = '0.6';
                wechatInput.style.cursor = 'not-allowed';
            }, queryDelay);
        }

        function animateProgress(targetPercent) {
            const duration = 1500; // 动画持续1.5秒
            const startTime = performance.now();
            const startWidth = 0;

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // 缓出效果
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentWidth = startWidth + (targetPercent - startWidth) * eased;

                progressBar.style.width = currentWidth + '%';
                progressPercent.textContent = Math.round(currentWidth) + '%';

                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    // 最终精确值
                    progressBar.style.width = targetPercent + '%';
                    progressPercent.textContent = targetPercent + '%';
                }
            }

            requestAnimationFrame(update);
        }

        // ==================== 重置处理 ====================
        function handleReset() {
            resultCard.classList.remove('show');
            wechatInput.disabled = false;
            wechatInput.style.opacity = '1';
            wechatInput.style.cursor = 'text';
            wechatInput.value = '';
            wechatInput.focus();
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            currentProgressValue = 0;
            btnQuery.style.display = 'inline-block';
            btnReset.style.display = 'none';
            isQuerying = false;

            // 滚动回查询卡片
            document.getElementById('queryCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ==================== 事件监听 ====================
        // 回车键查询
        wechatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!wechatInput.disabled) {
                    handleQuery();
                }
            }
        });

        // 输入时清除错误状态
        wechatInput.addEventListener('input', function() {
            if (wechatInput.classList.contains('error')) {
                wechatInput.classList.remove('error');
                wechatInput.placeholder = '请输入微信号 / 手机号';
            }
        });

        // 按钮涟漪效果
        btnQuery.addEventListener('click', function(e) {
            if (isQuerying) return;
            const ripple = document.createElement('span');
            ripple.className = 'btn-ripple';
            const rect = btnQuery.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btnQuery.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        });

        // 页面加载完成
        console.log('🚀 微云网络科技 - 微信解封进度查询系统已就绪');
        console.log('📋 共预设 ' + queryCases.length + ' 种审核情况，进度均在80%以下');
        console.log('💡 输入任意有效微信号即可体验查询功能');
    </script>
